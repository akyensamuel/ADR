<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}ADR System{% endblock %}</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    :root {
      --color-cream: #FDFBF7;
      --color-pink-primary: #D81B60;
      --color-pink-dark: #880E4F;
      --color-pink-light: #FCE4EC;
      --color-pink-hover: #C2185B;
      --color-text-main: #2C2C2C;
    }
    
    body {
      background-color: var(--color-cream);
      color: var(--color-text-main);
      font-family: 'Inter', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
    }
    
    .navbar-custom {
      background-color: var(--color-pink-primary);
      box-shadow: 0 2px 12px rgba(216, 27, 96, 0.15);
    }
    
    .navbar-custom .navbar-brand {
      font-weight: 700;
      letter-spacing: -0.5px;
    }
    
    .navbar-custom .nav-link {
      color: rgba(255, 255, 255, 0.85);
      font-weight: 500;
      transition: color 0.2s;
    }
    
    .navbar-custom .nav-link:hover,
    .navbar-custom .nav-link.active {
      color: #fff;
    }

    .nav-analyze-btn {
      background-color: #fff;
      color: var(--color-pink-primary) !important;
      border-radius: 20px;
      padding: 0.4rem 1rem !important;
      margin-left: 0.5rem;
      font-weight: 600 !important;
      transition: transform 0.2s, box-shadow 0.2s;
    }

    .nav-analyze-btn:hover {
      transform: translateY(-1px);
      box-shadow: 0 4px 8px rgba(0,0,0,0.1);
    }
  </style>
</head>
<body>
  <nav class="navbar navbar-expand-lg navbar-dark navbar-custom">
    <div class="container-fluid">
      <a class="navbar-brand" href="/"><i class="bi bi-activity"></i> ADR System</a>
      <div class="navbar-nav ms-auto align-items-center">
        <a class="nav-link" href="/">Dashboard</a>
        <a class="nav-link" href="/import/">Import Data</a>
        <a class="nav-link" href="/drugs/">Drug Catalog</a>
        <a class="nav-link" href="/patients/">Patient Records</a>
        <a class="nav-link" href="/meddra/">MedDRA Browser</a>
        <a class="nav-link" href="/detection/interaction-check/">Interaction Check</a>
        <a class="nav-link" href="/detection/symptom-extraction/">Symptom Extraction</a>
        <a class="nav-link" href="/recommender/safer-alternatives/">Safer Alternatives</a>
        <a class="nav-link nav-analyze-btn" href="/detection/analyze/"><i class="bi bi-magic"></i> Analyze Report</a>
      </div>
    </div>
  </nav>
  <main class="container py-5">
    {% if messages %}
    <div class="mb-4">
      {% for message in messages %}
      <div class="alert alert-{{ message.tags }} mb-2">{{ message }}</div>
      {% endfor %}
    </div>
    {% endif %}
    {% block content %}{% endblock %}
  </main>
</body>
</html>
